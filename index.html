<!DOCTYPE html>
<html lang="en" data-theme="light"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RatioGlide</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ambient-light orb-1"></div>
    <div class="ambient-light orb-2"></div>

    <header class="navbar">
        <div class="logo">RatioGlide</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="stat-item">
                <span id="target-wpm-disp">200</span> WPM
            </div>
            <button id="theme-btn" class="theme-switch">🌙 Dark</button>
        </div>
    </header>

    <main class="app-container">
        <section id="quiz-view" class="card hidden">
    <h2>Comprehension Check</h2>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Answer quickly. The clock is ticking.</p>
    
    <div id="question-container"></div>
</section>

<section id="results-view" class="card hidden">
    <h2>Session Analysis</h2>
    
    <div class="score-grid">
        <div class="score-card main-score">
            <h3>Effective Speed (ERS)</h3>
            <div class="big-number" id="final-ers">0</div>
            <span class="unit">WPM</span>
        </div>

        <div class="stats-row">
            <div class="score-card small">
                <h3>Raw Speed</h3>
                <div class="number" id="final-raw">0</div>
            </div>
            <div class="score-card small">
                <h3>Precision</h3>
                <div class="number" id="final-acc">0%</div>
            </div>
        </div>
    </div>

    <div class="feedback-box">
        <p id="coach-feedback" class="feedback-text">Analyzing performance...</p>
    </div>

    <button id="restart-btn" class="secondary-btn" onclick="location.reload()">New Session</button>
</section>
        
        <section id="config-panel" class="card active">
            <div style="margin: 2rem 0;">
    <label>Practice Material (Optional)</label>
    <textarea id="custom-input" 
              placeholder="Paste a CLAT passage here to test yourself..." 
              style="width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1); color: var(--text-primary); margin-top: 10px;"></textarea>
</div>
            <h2>Calibrate</h2>
            <p style="color: var(--text-secondary);">Set your target speed for this session.</p>
            
            <div style="margin: 2rem 0;">
                <label>Speed (WPM)</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="speed-slider" min="100" max="800" value="200" step="10">
                    <span id="slider-val" style="font-weight: bold; width: 50px;">200</span>
                </div>
            </div>
            
            <button id="start-btn" class="primary-btn">Initialize Session</button>
        </section>

        <section id="reader-view" class="card hidden">
            <div id="text-container" class="text-content"></div>
        </section>

        </main>

    <script src="script.js"></script>
</body>
</html>
