<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RatioGlide v6.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ambient-light orb-1"></div>
    <div class="ambient-light orb-2"></div>

    <header class="navbar">
        <div class="logo">RatioGlide <span style="font-size:0.5em; opacity:0.6">v6.0</span></div>
        <div class="nav-controls">
            <div class="stat-item"><span id="target-wpm-disp">250</span> WPM</div>
            <button id="theme-btn" class="theme-switch">🌙</button>
        </div>
    </header>

    <main class="app-container">
        
        <section id="config-panel" class="card active">
            
            <div class="section-block">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label>1. Content Source</label>
                    <select id="country-select" class="glass-select">
                        <option value="Global">🌍 Global / General</option>
                        <option value="India" selected>🇮🇳 India (CLAT)</option>
                        <option value="USA">🇺🇸 USA (LSAT)</option>
                        <option value="UK">🇬🇧 UK (LNAT)</option>
                    </select>
                </div>

                <div class="topic-grid">
                    <button class="topic-btn" onclick="selectTopic('Legal Reasoning')">⚖️ Legal</button>
                    <button class="topic-btn" onclick="selectTopic('Logical Arguments')">🧠 Logical</button>
                    <button class="topic-btn" onclick="selectTopic('Global Economics')">🌍 Economy</button>
                    <button class="topic-btn" onclick="selectTopic('Philosophy & Ethics')">📜 Ethics</button>
                </div>
                
                <div class="custom-gen-box">
                    <input type="text" id="custom-topic-input" placeholder="Or type any topic..." />
                    <button id="ai-generate-btn" class="icon-btn">✨</button>
                </div>
                <p id="status-msg" class="status-text">Ready</p>
            </div>

            <div class="section-block manual-block">
                <label>2. Manual / Import</label>
                <textarea id="manual-text-input" placeholder="Paste text here..." class="manual-textarea"></textarea>
                <div class="file-upload-wrapper">
                    <label for="file-upload" class="secondary-btn small-btn">📂 Import .txt</label>
                    <input type="file" id="file-upload" accept=".txt">
                    <span id="file-name-disp"></span>
                </div>
            </div>

            <div class="section-block">
                <label>3. Reading Experience</label>
                <div class="settings-grid">
                    <div class="control-group">
                        <span>Speed</span>
                        <input type="range" id="speed-slider" min="150" max="800" value="250" step="10">
                        <span id="slider-val">250</span>
                    </div>
                    <div class="toggles-group">
                        <button id="paper-mode-btn" class="toggle-btn" onclick="togglePaperMode()">📜 Paper Mode</button>
                        <button id="focus-blur-btn" class="toggle-btn" onclick="toggleFocusBlur()">💧 Focus Blur</button>
                    </div>
                </div>
            </div>
            
            <button id="start-btn" class="primary-btn">Initialize Session</button>
        </section>

        <section id="reader-view" class="card hidden">
            <div id="text-container" class="text-content"></div>
        </section>

        <section id="quiz-view" class="card hidden">
            <div id="ai-loader" class="hidden text-center">
                <div class="loader-spinner"></div>
                <h3>Evaluating...</h3>
            </div>
            <div id="quiz-content">
                <h2>Deep Analysis</h2>
                <div id="question-container"></div>
            </div>
        </section>

        <section id="sequence-view" class="card hidden">
            <h2>Logic Chain</h2>
            <p class="sub-text">Reconstruct the argument order.</p>
            <div id="sequence-container" class="sequence-grid"></div>
            <div id="sequence-feedback" class="feedback-mini"></div>
            <button id="finish-seq-btn" class="primary-btn hidden">Finalize Score</button>
        </section>

        <section id="results-view" class="card hidden">
            <h2>Report</h2>
            <div class="score-grid">
                <div class="score-card main-score">
                    <h3>Effective WPM</h3>
                    <div class="big-number" id="final-ers">0</div>
                </div>
                <div class="stats-row">
                    <div class="score-card small"><h3>Raw</h3><div class="number" id="final-raw">0</div></div>
                    <div class="score-card small"><h3>Acc</h3><div class="number" id="final-acc">0%</div></div>
                </div>
            </div>

            <div class="feedback-box"><p id="coach-feedback">...</p></div>

            <div class="vocab-section">
                <h3>📚 Vocabulary</h3>
                <div id="vocab-container" class="vocab-grid"></div>
            </div>

            <div class="review-section">
                <h3>🔍 Review</h3>
                <p class="sub-text">Highlight to define.</p>
                <div id="review-text-container" class="review-text-box"></div>
            </div>
            <button id="restart-btn" class="secondary-btn">New Session</button>
        </section>

    </main>

    <div id="lookup-tooltip">
        <div class="tooltip-content">
            <h4 id="tt-word">Word</h4>
            <p id="tt-def">Definition...</p>
            <a id="tt-link" href="#" target="_blank">Search &rarr;</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
